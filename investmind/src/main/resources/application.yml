server:
  port: 8081
  address: 127.0.0.1
  servlet:
    context-path: /api

spring:
  application:
    name: investmind

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/investmind?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.investmind.model
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

investmind:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173}

  ai:
    api-key: sk-wucEpRI7loJBLuUwn1MumRK2PZDJWR2SlOBwYyFol4moavsB
    base-url: https://api.moonshot.cn/v1
    model: moonshot-v1-8k
    chat-endpoint: /chat/completions
    embedding-endpoint: /embeddings
    embedding-model: text-embedding-3-small
    max-tokens: 1000
    temperature: 0.7
    web-search-enabled: false
    web-search-base-url: https://s.jina.ai/
    web-search-max-chars: 4000

  jwt:
    secret: ${JWT_SECRET:SW52ZXN0TWluZFNlY3JldEtleTIwMjRVc2VkRm9ySldUVG9rZW5HZW5lcmF0aW9uQW5kVmFsaWRhdGlvblBsdXNFbm91Z2hMZW5ndGhGb3JIUzUxMkFsZ29yaXRobQ==}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800}

  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: ${MILVUS_COLLECTION:invest_reports}
    dimension: ${MILVUS_DIMENSION:1536}

logging:
  level:
    com.investmind: debug
    com.baomidou.mybatisplus: debug
